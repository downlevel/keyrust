[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]
# cargo-fuzz targets live in their own workspace (nightly only).
exclude = ["fuzz"]
# The Tauri app needs platform GUI libraries (WebView2 / webkit2gtk) to build;
# plain `cargo build` / `cargo test` at the root only touch the portable core.
default-members = ["crates/core"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Mauro Giulivi"]
repository = "https://github.com/downlevel/keyrust"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"

# The KDBX key derivation (AES-KDF / Argon2), decryption and decompression are
# unbearably slow unoptimised, so these crates are optimised even in dev/test
# builds. Only them: optimising every dependency (Tauri, GTK, …) makes each
# uncached build much slower for no benefit. `keepass` is included because the
# generic cipher/digest code is instantiated there.
[profile.dev.package.keepass]
opt-level = 3
[profile.dev.package.rust-argon2]
opt-level = 3
[profile.dev.package.blake2b_simd]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
[profile.dev.package.block-modes]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.twofish]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.hybrid-array]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.quick-xml]
opt-level = 3

# Release profile for the desktop app (https://tauri.app/concept/size/).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
