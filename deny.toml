# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Keyrust is GPL-3.0-or-later: every dependency licence must be compatible.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error (build-time proc macro) is unmaintained. It only reaches us
    # through the gtk-rs 0.18 bindings Tauri uses on Linux; no maintained
    # replacement exists downstream. Revisit when Tauri moves off GTK3.
    { id = "RUSTSEC-2024-0370", reason = "transitive via Tauri's Linux GTK3 backend, no fix available" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
