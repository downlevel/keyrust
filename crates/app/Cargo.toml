[package]
name = "keyrust-app"
description = "Keyrust desktop app (Tauri 2 shell around keyrust-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
default-run = "keyrust"

[lib]
# Distinct lib name: on Windows a lib and bin with the same name collide
# (https://github.com/rust-lang/cargo/issues/8519).
name = "keyrust_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "keyrust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyrust-core = { path = "../core" }
tauri = { version = "2", features = [] }
# Called from Rust only: no plugin permission is granted to the webview.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
arboard = { version = "3", features = ["wayland-data-control"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter", "ansi"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
