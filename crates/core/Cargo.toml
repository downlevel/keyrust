[package]
name = "keyrust-core"
description = "Vault, crypto and KDBX4 format layer of Keyrust (no UI dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
keepass = { version = "=0.17.0", features = ["save_kdbx4"] }

[dev-dependencies]
argon2 = { package = "rust-argon2", version = "3.0" }
roxmltree = "0.20"
tempfile = "3"
chrono = { version = "0.4", default-features = false }

[lints]
workspace = true
