name: CI

on:
  push:
    # Documentation-only pushes skip CI; pull requests always run it, so
    # required checks are never left pending.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - LICENSE
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds per fuzz target (long manual run)"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: core

      - name: Install KeePassXC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends keepassxc
      - name: Install KeePassXC (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask keepassxc
          echo "KEEPASSXC_CLI=/Applications/KeePassXC.app/Contents/MacOS/keepassxc-cli" >> "$GITHUB_ENV"
      - name: Install KeePassXC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install keepassxc -y --no-progress
          "KEEPASSXC_CLI=C:\Program Files\KeePassXC\keepassxc-cli.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check keepassxc-cli
        shell: bash
        run: '"${KEEPASSXC_CLI:-keepassxc-cli}" --version'

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy (core)
        run: cargo clippy -p keyrust-core --all-targets -- -D warnings
      # KEYRUST_SKIP_KEEPASSXC is deliberately not set: a missing KeePassXC fails the job.
      - name: Test (core, KeePassXC compatibility)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p keyrust-core 2>&1 | tee test-output.txt
      - name: Report failed tests as annotations
        if: failure()
        shell: bash
        run: python3 .github/scripts/annotate_test_failures.py test-output.txt
      # The committed fuzz seeds still open, and the round-trip harness holds.
      - name: Test (core, fuzzing harness)
        run: cargo test -p keyrust-core --features fuzzing --test fuzz_seeds
      # Screen-lock state and the Windows suspend registration, on each OS.
      - name: Test (os)
        run: cargo test -p keyrust-os

  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            bundles: deb
          - os: windows-latest
            platform: windows
            bundles: nsis
          - os: macos-latest
            platform: macos
            bundles: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install Tauri prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: app
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: crates/app/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/app/ui/pnpm-lock.yaml

      - name: Frontend checks
        working-directory: crates/app/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm lint
          pnpm format:check
          pnpm test
          # tauri::generate_context! needs the built frontend to exist.
          pnpm build

      # Accessibility audit (axe, keyboard, focus, reduced motion) on the demo
      # build in Chromium: the same on every OS, so it runs once.
      - name: Accessibility audit (Linux)
        if: runner.os == 'Linux'
        working-directory: crates/app/ui
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:web
      - name: Upload the accessibility report
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: crates/app/ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (app)
        run: cargo test -p keyrust-app

      # Installers are the slowest step: built for pull requests, pushes to main
      # and manual runs, not for every push to a branch.
      - name: Build the desktop app (debug, unsigned)
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        working-directory: crates/app/ui
        run: pnpm tauri build --debug --bundles ${{ matrix.bundles }}
      - if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyrust-${{ matrix.platform }}-debug
          path: target/debug/bundle/
          retention-days: 7
          if-no-files-found: error

  # The real app (Rust backend, IPC, WebKitGTK) on copies of the KeePassXC
  # fixtures, driven through tauri-driver. Runs on every event: it verifies
  # branches too, not only pull requests.
  e2e:
    name: e2e (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install Tauri prerequisites, WebKitWebDriver, Xvfb and KeePassXC
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            webkit2gtk-driver xvfb dbus
          sudo apt-get install -y --no-install-recommends keepassxc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: e2e
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version 2.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: crates/app/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            crates/app/ui/pnpm-lock.yaml
            crates/app/e2e/pnpm-lock.yaml
      - name: Build the app (debug, no installer, unsigned)
        working-directory: crates/app/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --debug --no-bundle
      - name: Smoke test
        run: |
          set -o pipefail
          echo "KEYRUST_E2E_DIR=$RUNNER_TEMP/keyrust-e2e" >> "$GITHUB_ENV"
          export KEYRUST_E2E_DIR="$RUNNER_TEMP/keyrust-e2e" KEYRUST_LOG=info
          pnpm --dir crates/app/e2e install --frozen-lockfile
          pnpm --dir crates/app/e2e check
          # A session bus, as on a desktop: without one GTK waits ~25 s for the
          # desktop portal before the window appears.
          xvfb-run -a dbus-run-session -- pnpm --dir crates/app/e2e test 2>&1 |
            tee "$RUNNER_TEMP/e2e.log"
      # The file the real app saved is still a database KeePassXC reads, with
      # the new title; the KDBX 3.1 copy was opened but never written.
      - name: KeePassXC reads the saved file
        run: |
          printf '%s\n' keyrust-test-password |
            keepassxc-cli show -q -a Title "$KEYRUST_E2E_DIR/vaults/keepassxc-rich.kdbx" \
              "/Work/Dev/GitHub (e2e)" | tee "$RUNNER_TEMP/title.txt"
          test "$(cat "$RUNNER_TEMP/title.txt")" = "GitHub (e2e)"
          cmp "$KEYRUST_E2E_DIR/vaults/keepassxc-kdbx31.kdbx" tests/fixtures/keepassxc-kdbx31.kdbx
      # Job logs need a login to read; annotations are public. The logs carry no
      # field values (logging policy) and the fixture password is public.
      - name: Report the end of the log as an annotation
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/e2e.log" ]; then
            # Test results and app logs only, without the D-Bus and portal noise;
            # an annotation holds about 4 KB.
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/e2e.log" |
              grep -E '^\[(0-0|wry)|Error|keyrust_' | grep -vE 'WARNING|dbus-daemon|^\[0-0\] *$' |
              tail -c 3800 |
              python3 -c "import sys; print('::error title=e2e log (filtered)::' + sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))"
          fi
      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/keyrust-e2e/artifacts/
          retention-days: 7
          if-no-files-found: ignore

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          rust-version: "1.99.1"

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FUZZ_SECONDS: ${{ github.event.inputs.fuzz_seconds || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuzz
          workspaces: fuzz
      - name: Run every fuzz target
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            mkdir -p "corpus/$target"
            cargo +nightly fuzz run "$target" "corpus/$target" -- \
              -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048
          done
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 14
